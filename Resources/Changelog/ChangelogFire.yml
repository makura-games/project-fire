- author: ThereDrD
  changes:
  - message: Масштабная переработка SCP-096!
    type: Add
  - message: Добавлена механика побега для SCP-096. Для этого ему требуется использовать способность Сдирания кожи с лица. После нескольких нажатий он перейдет в состояние содранного лица, в котором может открывать любые шлюзы и гермоворота и наносить урон людям. Из-за содранного лица он больше не сможет агриться, когда кто-то посмотрит на него. Для восстановления лица требуется использовать пластыри.
    type: Add
  - message: Переработан аудио-визуал состояния скромника и его состояний. Теперь перед агрессивным состоянием он имеет фазу подготовки, в которой стоит на месте, крутится, трясется и начинает орать. Внешний вид скромника полностью преобразился и стал страшнее. Добавлены амбиенты для скромника и посмотревшего со своим настроением.
    type: Add
  - message: Добавлена возможность застанить скромника в спокойном состоянии. Но при каждом получении урона, выстреле по нему есть шанс перевести его в режим агрессии.
    type: Add
  - message: Добавлена возможность поймать скромника ударив его, аналогично с наручниками.
    type: Add
  - message: Переработан урон скромника. Теперь в агрессивном состоянии он имеет структурный урон, а после убийства своей цели ему требуется продолжить разрывать жертву некоторое время.
    type: Add
  - message: Скромник получил руки, которыми может подбирать некоторые неопасные предметы и играться. Предметы можно выбить, обезоружив объект, но есть нюанс...
    type: Add
  - message: Скромник больше не видит НЕ своих целей в режиме агрессии. Их спрайт скрывается.
    type: Add
  - message: Скромник теперь плачет особым реагентом, который постепенно испаряется. Его слезы можно использовать в качестве альтернативы окулина. В будущем это будет важным компонентов для исследований и химии. При сдирании лица скромник начинает плакать кровью
    type: Add
  - message: Добавлена возможность сесть за скромника. В этом состоянии он плачет активнее.
    type: Add
  - message: Переработан визуальная и частично балансная часть боевки. Теперь все острое и огнестрельное оружие вызывает разлет частичек крови прямо из организма человека. Коридоры теперь будут более кровавыми, а люди более обескровленными. Для защиты требуется носить броню
    type: Add
  id: 306
