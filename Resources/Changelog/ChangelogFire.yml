  changes:
  - message: Добавлена система страха. Теперь каждый персонаж обладает способностью испугаться чего-то страшного. Страх влияет на геймплей и создает визуальные и звуковые эффекты. Чем больше страх, тем сильнее эффекты. Разные роли по-разному испытывают страх, одни более привыкли одним условиям, другие к другим.
    type: Add
  - message: В окно описания персонажа в игре добавлены описания каждого страха, которые есть у персонажа.
    type: Add
  - message: Добавлены новые трейты, связанные со страхом. Выбрать их можно в редакторе персонажа
    type: Tweak
  - message: SCP-106 теперь может накапливать страх и выплескивать его на окружающих. Когда объект ловит в измерение человека, он собирает его страх. Затем, с помощью способности, SCP-106 может задать всем в радиусе максимально собранный уровень
    type: Tweak
  - message: Люди, попадающие в карманное измерение, теперь будут испытывать контролируемый ужас, пока не выйдут из измерения.
    type: Tweak
  - message: Игрок, чей персонаж боится, будет слышать особый амбиент
    type: Tweak
  - message: Закрытие глаз избавит персонажа от возможности испугаться, но не поможет, если он уже испугался.
    type: Tweak
  - message: Засыпая, персонаж теперь закрывает глаза. И открывает после.
    type: Tweak
  - message: Добавлены модификаторы настроения, связанные со страхом. А так же модификатор, появляющийся, когда рядом с персонажем кто-то умирает
    type: Tweak
  - message: Алкоголь теперь помогает бороться с эффектами страха, делая их меньше
    type: Tweak
  - message: Исправлено проигрывание амбиента измерения SCP-106 у Д класса в их блоке. Теперь играет тот амбиент, что задуман изначально
