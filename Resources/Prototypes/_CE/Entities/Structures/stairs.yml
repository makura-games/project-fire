- type: entity
  id: CEZLevelLadderBase
  abstract: true
  parent: BaseStructure
  name: stairs
  description: Be careful, the higher you ascend, the more painful the fall.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: PlacementReplacement
    key: walls
  - type: Occluder
    boundingBox: "-0.5,0.25,0.5,0.5"
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/wooden.rsi
    state: straight
    drawdepth: Mobs
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.5,0.5,0.6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
      slowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: CEZLevelHighGround
    stick: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.1
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.3
    sprintSpeedModifier: 0.3

- type: entity
  parent: CEZLevelLadderBase
  id: CEZLevelLadderWooden
  name: wooden ladder

- type: entity
  parent: CEZLevelLadderBase
  id: CEZLevelLadderWoodenCorner
  name: wooden ladder
  suffix: Corner
  components:
  - type: Sprite
    state: corner
  - type: Occluder
    enabled: false
  - type: CEZLevelHighGround
    corner: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.5
    - 0.1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "0.5,0.5,0.6,0.6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
      slowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false

- type: entity
  parent: CEZLevelLadderWoodenCorner
  id: CEZLevelLadderWoodenCornerInner
  name: wooden ladder
  suffix: Inner Corner
  components:
  - type: Sprite
    state: internal_corner
  - type: Occluder
    enabled: true
    boundingBox: "-0.5,-0.5,0.5,0.5"
