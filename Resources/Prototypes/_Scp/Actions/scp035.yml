- type: entity
  id: ActionScp035OrderLoose
  name: Loose
  description: Command your army to act at their own will.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    priority: 8
  - type: Sprite
    sprite: _Scp/Actions/scp-035.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: loose
  - type: InstantAction
    event:
      !type:MaskOrderActionEvent
      type: Loose

- type: entity
  id: ActionScp035Stun
  name: Hypnosis
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 180
    priority: 9
  - type: Sprite
    sprite: _Scp/Actions/scp-035.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: hypnosis
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:MaskStunActionEvent
    canTargetSelf: false
    whitelist:
      components:
      - MobState
  - type: SpeakOnAction
    sentence: scp-035-action-stun

- type: entity
  parent: BaseAction
  id: ActionScp035Tentacles
  name: Summon Tentacles
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 180
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: spell_default
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: EffectGoliathTentacleSpawn # TODO: собственные щупальца для 035
      posData: !type:TargetInFront
