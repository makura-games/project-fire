# TODO: Кастомные названия + описания

- type: entity
  id: ActionScp035RaiseArmy
  name: Raise Army
  description: Spend some hunger to summon an allied rat to help defend you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 4
  - type: Sprite
    sprite: _Scp/Actions/scp-035.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: raise
  - type: InstantAction
    event: !type:MaskRaiseArmyActionEvent

- type: entity
  id: ActionScp035OrderStay
  name: Stay
  description: Command your army to stand in place.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    priority: 5
  - type: Sprite
    sprite: _Scp/Actions/scp-035.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: stay
  - type: InstantAction
    event:
      !type:MaskOrderActionEvent
      type: Stay

- type: entity
  id: ActionScp035OrderFollow
  name: Follow
  description: Command your army to follow you around.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    priority: 6
  - type: Sprite
    sprite: _Scp/Actions/scp-035.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: follow
  - type: InstantAction
    event:
      !type:MaskOrderActionEvent
      type: Follow

- type: entity
  id: ActionScp035OrderKill
  name: Kill 'Em
  description: Command your army to attack whoever you point at.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    priority: 7
  - type: Sprite
    sprite: _Scp/Actions/scp-035.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: attack
  - type: InstantAction
    event:
      !type:MaskOrderActionEvent
