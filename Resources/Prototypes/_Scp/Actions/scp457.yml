- type: entity
  parent: BaseAction
  id: Scp457Fire
  name: Ignite tile
  description: Ignites the tile you are standing on.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    raiseOnUser: true
  - type: Sprite
    sprite: _Scp/Mobs/Scp/scp-457.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: fire
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: Scp457Flame
      posData: !type:TargetCasterPos
  - type: SafeTimeRestricted
