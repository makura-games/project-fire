- type: entity
  id: ActionScp049Resurrect
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: NoItem
    priority: 12
  - type: Sprite
    sprite: _Scp/Actions/scp-049.rsi
    layers:
    - map: [ "enum.ActionVisuals.Icon" ]
      state: resurrect
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:Scp049ResurrectAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    blacklist:
      components:
      - Scp
      - Scp049Protection

