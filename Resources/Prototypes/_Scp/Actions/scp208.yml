- type: entity
  id: Scp208Shield
  name: Physical shield
  description: You create a strong barrier right in front of your opponent.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: shield
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: WallForce
      posData: !type:TargetInFront

- type: entity
  id: Scp208Heal
  name: god's treatment
  description: You focus your healing ability on a specific person.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      useDelay: 30
      icon:
        sprite: /Textures/_Scp/Mobs/Scp/scp-208.rsi
        state: scp-208
      itemIconStyle: NoItem
    - type: TargetAction
      repeat: false
      range: 3
      checkCanAccess: true
    - type: EntityTargetAction
      canTargetSelf: false
      event: !type:Scp208HealTargetActionEvent
