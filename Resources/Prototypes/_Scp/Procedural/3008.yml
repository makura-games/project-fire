- type: dungeonConfig
  id: 3008Base
  layers:
  - !type:PrototypeDunGen
    proto: Scp3008WallFloor
  - !type:PrototypeDunGen
    proto: Scp3008Floor
  - !type:PrefabDunGen
    presets:
    - IkeaRooms
    fallbackTile: ScpFloorSteel
    roomWhitelist:
      tags:
      - IkeaRooms
  - !type:PrototypeDunGen
    proto: Scp3008Walls
    inheritDungeons: All

#  - !type:BoundaryWallDunGen
#    wall: Scp3008Wall
#    cornerWall: Scp3008Wall
#    tile: ScpFloorSteel

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  - !type:EntranceFlankDunGen
    tile: ScpFloorSteel
    contents: 3008WallsLights

  - !type:EntityTableDunGen
    minCount: 50
    maxCount: 80
    perDungeon: true
    ignoreReserved: true
    table: !type:GroupSelector
      children:
      - id: Scp3008Label1
      - id: Scp3008Label2
      - id: Scp3008Label3
      - id: FoodPacketChocolateTrash
      - id: FoodPacketChipsTrash
      - id: FoodPacketEnergyTrash
      - id: FoodPacketCnDsTrash
      - id: FoodPacketBoritosTrash

  - !type:EntityTableDunGen
    minCount: 50
    maxCount: 60
    perDungeon: true
    ignoreReserved: true
    table: !type:GroupSelector
      children:
      - id: WallHornScp3008
      - id: JanitorialTrolley
      - id: ScpChairOfficeLight
      - id: ComfyChair
      - id: ScpTableWood
      - id: ComfyChairRed
      - id: MobRoomba

  - !type:MobsDunGen
    minCount: 160
    maxCount: 180
    contents: 3008Mobs

  # TODO: Add Mobs/Items.
  # For items -> LimitedEntityDunGen
  # For mobs -> MobsDunGen

- type: dungeonConfig
  id: 3008
  layers:
  - !type:PrototypeDunGen
    proto: 3008Base

- type: dungeonConfig
  id: Scp3008Floor
  layers:
  - !type:NoiseDistanceDunGen
    size: 300, 300
    distanceConfig: !type:DunGenSquareBump
      blendWeight: 0.00
    layers:
    - tile: ScpFloorSteel
      threshold: -1.00
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 1

- type: dungeonConfig
  id: Scp3008WallFloor
  layers:
  - !type:NoiseDistanceDunGen
    size: 306, 306
    distanceConfig: !type:DunGenSquareBump
      blendWeight: 0.00
    layers:
    - tile: FloorMetalPurple
      threshold: -1.00
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 1

- type: dungeonConfig
  id: Scp3008Walls
  layers:
  - !type:FillGridDunGen
    entity: Scp3008Wall
    allowedTiles:
    - FloorMetalPurple
