- type: dungeonRoomPack
  id: IkeaRoomsPack23x5
  size: 23,5
  rooms:
    - 0,0,23,5

- type: entity
  parent: ScpWallConcreteLightContainment
  id: Scp3008Wall
  categories: [HideSpawnMenu]
  components:
  - type: RCDDeconstructable
    cost: 666
    delay: 666
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 999999
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: WallHornScp3008
  parent: SunriseWallhornWhite
  name: loudspeaker
  suffix: SCP-3008
  components:
  - type: AmbientSound
    enabled: false
    range: 75
    volume: -13
    sound:
      path: /Audio/_Scp/Events/Scp3008/IKEA.ogg
  - type: AmbientOnPowered
  - type: Battery
    netsync: false
    maxCharge: 50
    startingCharge: 0
  - type: AnnouncementSpeaker
    range: 20
    enabled: false
    requiresPower: true

- type: entity
  parent:
  - ScpDebugInvisibleAPCRecharging
  - ScpDebugInvisibleSubstationRecharging
  - ScpDebugInvisibleGenerator
  id: Scp3008Energy
  name: scp 3008 battery
  components:
  - type: Apc
    maxLoad: 9999999
  - type: BatterySelfRecharger
    autoRechargeRate: 99999999
  - type: RepeatingTrigger
    delay: 600 # 10 min
  - type: PolymorphOnTrigger
    polymorph: DayToNight

- type: entity # пустышка
  parent: ScpDebugInvisibleGenerator
  id: Scp3008EnergyOff
  name: scp 3008 battery off
  components:
  - type: RepeatingTrigger
    delay: 600 # 10 min
  - type: PolymorphOnTrigger
    polymorph: NightToDay

- type: entity
  parent: PosterBase
  id: Scp3008Label1
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _Scp/Structures/Furniture/ikea_label.rsi
    state: label1
  - type: SpriteFade

- type: entity
  parent: Scp3008Label1
  id: Scp3008Label2
  components:
  - type: Sprite
    sprite: _Scp/Structures/Furniture/ikea_label.rsi
    state: label2

- type: entity
  parent: Scp3008Label1
  id: Scp3008Label3
  components:
  - type: Sprite
    sprite: _Scp/Structures/Furniture/ikea_label.rsi
    state: label3

- type: entityTable
  id: 3008CorridorEntities
  table: !type:GroupSelector
