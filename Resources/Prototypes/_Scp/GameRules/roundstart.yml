- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseChaosRaidRule
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesOperationPrefix
    - NamesOperationSuffix
    nameFormat: name-format-nuclear-operation
  - type: RuleGrids
  - type: AntagSelection
  - type: AntagLoadProfileRule
    speciesOverride: Human

- type: entity
  id: ScpChaosRaid
  parent: BaseChaosRaidRule
  components:
  - type: GameRule
    minPlayers: 25
  - type: LoadMapRule
    mapPath: /Maps/_Scp/Nonstation/ChaosPlanet.yml
  - type: ChaosRaidRule
  - type: AntagRandomObjectives
    sets:
    - groups: ChaosRaidObjectiveGroups
      maxPicks: 4
    maxDifficulty: 3
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    antags:
    - !type:FixedAntagCount
      proto: ChaosRaiderLeader
    - !type:LinearAntagCount
      proto: ChaosRaiderMedic
      range:
        min: 1
        max: 3
    - !type:LinearAntagCount
      proto: ChaosRaiderFighter
      range:
        min: 4
        max: 8
  - type: DynamicRuleCost
    cost: 200

- type: entity
  parent: BaseGameRule
  id: ScpChaosSpy
  components:
  - type: GameRule
    minPlayers: 25
  - type: ChaosSpyRule
  - type: DynamicRuleCost
    cost: 100

- type: entity
  parent: BaseGameRule
  id: ScpChaosHighSpy
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 25
  - type: ChaosSpyRule
    addSleepSpies: true
  - type: AntagRandomObjectives
    sets:
    - groups: ChaosSpyObjectiveGroups
      maxPicks: 4
    maxDifficulty: 4
  - type: AntagSelection
    agentName: chaos-spy-round-end-agent-name
    selectionTime: RuleStarted
    antags:
    - !type:LinearAntagCount
      proto: ChaosSpyHigh
      range:
        min: 2
        max: 4

- type: entity
  parent: BaseGameRule
  id: ScpChaosLowSpy
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 25
  - type: ChaosSpyRule
    addSleepSpies: true
  - type: AntagRandomObjectives
    sets:
    - groups: ChaosSpyObjectiveGroups
      maxPicks: 4
    maxDifficulty: 4
  - type: AntagSelection
    agentName: chaos-spy-round-end-agent-name
    selectionTime: RuleStarted
    antags:
    - !type:LinearAntagCount
      proto: ChaosSpyLow
      range:
        min: 3
        max: 5

- type: entity
  parent: BaseGameRule
  id: ScpChaosSleepSpy
  components:
  - type: GameRule
    minPlayers: 25
  - type: ChaosSleepSpyRule
  - type: AntagSelection
    selectionTime: RuleStarted
    removeUponFailedSpawn: false
    antags:
    - !type:LinearAntagCount
      proto: ChaosSleepSpy
      range:
        min: 3
        max: 4

- type: entity
  id: ScpMetaGarbageSpawn
  parent: BaseGameRule
  components:
  - type: MetaGarbageSpawnRule

- type: entity
  id: BasicFoundationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 480
    minMaxEventTiming:
      min: 360 # 6 mins
      max: 720 # 12 mins
    scheduledGameRules: !type:NestedSelector
      tableId: ScpBasicGameRulesTable
  - type: RoundstartStationVariationRule
    rules:
    - id: ScpSolidWallRustingVariationPass
    - id: ScpReinforcedWallRustingVariationPass

- type: entity
  id: BasicFoundationChillEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 480
    minMaxEventTiming:
      min: 360 # 6 mins
      max: 720 # 12 mins
    scheduledGameRules: !type:NestedSelector
      tableId: ScpBasicChillGameRulesTable

- type: entityTable
  id: ScpBasicGameRulesTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: ScpBasicCalmEventsTable
    - !type:NestedSelector
      tableId: ScpEventsTable
#    - !type:NestedSelector
#      tableId: ScpAntagEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable

- type: entityTable
  id: ScpBasicChillGameRulesTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: ScpBasicCalmEventsTable
    - !type:NestedSelector
      tableId: ScpEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable

- type: entityTable
  id: ScpBasicCalmEventsTable
  table: !type:AllSelector
    children:
    - id: BluespaceArtifact
    - id: BureaucraticError
    - id: ClericalError
    - id: ScpCockroachMigration
    - id: GreytideVirus
    - id: IonStorm
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: RandomSentience
    - id: VentClog
    - id: GasLeak
    - id: SolarFlare

- type: entityTable
  id: ScpAntagEventsTable
  table: !type:AllSelector
    children:
    - id: Scp2054X

- type: entity
  id: FreeScpRule
  parent: BaseGameRule
  components:
  - type: FreeScpRule
