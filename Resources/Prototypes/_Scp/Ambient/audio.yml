# Амбиенты

- type: ambientMusic
  id: Shuttle
  sound:
    params:
      volume: -15
    collection: FireAmbienceShuttle
  fadeIn: true
  interruptable: true
  conditions:
  - !type:NearbyEntitiesCondition
    count: 2
    whitelist:
      tags:
      - ShuttleChair
    range: 6
  priority: 5

- type: ambientMusic
  id: FearAmbience
  sound:
    collection: ScpFearAmbience
    params:
      volume: -12
  conditions:
  - !type:ScpMobStateCondition
    allowedStates: [Alive, Critical]
  - !type:FearStateCondition
    requiredState: Anxiety
    canBeGreater: true
  interruptable: true
  priority: 100

- type: ambientMusic
  id: ClassDAmbience
  sound:
    params:
      volume: -12
    collection: FireAmbienceClassD
  conditions:
  - !type:IsClassDCondition
  - !type:NearbyEntitiesCondition
    count: 4
    whitelist:
      tags:
      - ClassDSpawner
    range: 16
  fadeIn: true
  interruptable: true
  priority: 99

- type: ambientMusic
  id: ShiftAdded
  sound:
    collection: FireAmbienceShiftAdded
    params:
      volume: -12
      loop: true
  conditions:
  - !type:AlwaysFalseCondition

- type: ambientMusic
  id: ShiftStarted
  sound:
    collection: FireAmbienceShiftStarted
    params:
      volume: -6
      loop: true
  conditions:
  - !type:AlwaysFalseCondition

- type: ambientMusic
  id: ShiftAverted
  sound:
    collection: FireAmbienceShiftAverted
    params:
      loop: true
  conditions:
  - !type:AlwaysFalseCondition

- type: ambientMusic
  id: BeingDead
  sound:
    collection: ScpAmbienceDead
    params:
      volume: -8
  conditions:
  - !type:ScpMobStateCondition
    allowedStates: [Dead, Critical]
  interruptable: true
  priority: 101

- type: ambientMusic
  id: Scp096Target
  sound:
    collection: ScpAmbienceScp096Target
    params:
      volume: -2
  conditions:
  - !type:OwnerWhitelistCondition
    whitelist:
      components:
      - Scp096Target
  interruptable: true
  priority: 110
- type: ambientMusic
  id: Scp096Rage
  sound:
    collection: ScpAmbienceScp096Rage
    params:
      volume: 20
  conditions:
  - !type:OwnerWhitelistCondition
    whitelist:
      components:
      - ActiveScp096Rage
      - ActiveScp096HeatingUp
  interruptable: true
  priority: 110

