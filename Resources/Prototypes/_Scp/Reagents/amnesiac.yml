- type: reagent
  id: AmnesiacA
  name: reagent-amnesiac-a-name
  group: Toxins
  desc: reagent-amnesiac-a-desc
  flavor: bitter
  color: "#acb78e"
  physicalDesc: reagent-physical-desc-nothing
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        messages: [ reagent-amnesiac-a-msg ]
        probability: 1
        conditions:
        - !type:BreathingCondition
        - !type:InternalsCondition
          inverted: true
        - !type:ScpCondition
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 2
        type: Add
        conditions:
        - !type:BreathingCondition
        - !type:InternalsCondition
          inverted: true
        - !type:ScpCondition
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: StatusEffectAmnesiacA
        time: 120
        type: Update
        conditions:
        - !type:BreathingCondition
        - !type:InternalsCondition
          inverted: true
        - !type:ScpCondition
          inverted: true
  metabolisms:
    Bloodstream:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        messages: [ reagent-amnesiac-a-msg ]
        probability: 1
        conditions:
        - !type:ReagentCondition
          reagent: AmnesiacA
          min: 5
        - !type:ScpCondition
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 5
        type: Add
        conditions:
        - !type:ReagentCondition
          reagent: AmnesiacA
          min: 4
        - !type:ScpCondition
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: StatusEffectAmnesiacA
        time: 120
        type: Update
        conditions:
        - !type:ReagentCondition
          reagent: AmnesiacA
          min: 4
        - !type:ScpCondition
          inverted: true

