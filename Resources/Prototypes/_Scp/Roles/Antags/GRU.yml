- type: randomHumanoidSettings
  id: GRULeader
  parent: CommonGRULeader
  randomizeName: false
  components:
  - type: GhostRole
    name: ghost-role-information-gru-leader-name
    description: ghost-role-information-gru-leader-description
    rules: ghost-role-information-chaos-rules
    raffle:
      settings: short
  - type: Loadout
    prototypes: [ GRULeaderGear ]
  - type: TimedRemoveComponents
    removeAfter: 2
    components:
    - type: Implanted

- type: startingGear
  id: GRULeaderGear
  equipment:
    jumpsuit: ClothingUniformGRU
    back: ClothingBackpackMessengerGRU
    shoes: ClothingShoesBootsUSSPFilled
    head: ClothingHeadHatBeretCommand
    mask: ClothingMaskGRU
    eyes: ClothingEyesNVDSec
    gloves: ClothingHandsGlovesMtfMilitary
    outerClothing: ClothingOuterArmorGRU
    suitstorage: WeaponRifleGroza
    belt: ClothingBeltGRUrigFilled
    ears: ClothingHeadsetGRU
    pocket1: GRUAccessBreakerLimited
  storage:
    back:
    - Crowbar

