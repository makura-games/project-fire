    jumpsuit: ClothingUniformJumpsuitBrigmedic
    shoes: ClothingShoesColorRed
    back: ClothingBackpackBrigmedic
    gloves: ClothingHandsGlovesLatex
    eyes: ClothingEyesHudMedSec
    head: ClothingHeadHatBeretSecurityMedic
    id: KeyCardFieldMedicalSpecialist
    ears: ClothingHeadsetFieldMedicalSpecialist
    belt: ClothingBeltMedicalFilled
    pocket1: AmnesiacSpray
    pocket2: ScpMedicalPDA
  storage:
    back:
    - Flash
    - ScpRadioHandheldSecurityEnabled
