        mask:
        - FullTileMask
        layer:
        - GlassLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.38125,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
      fix3:
        shape:
          !type:PhysShapeAabb
          bounds: "0.38125,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: InteractionOutline
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
    - West

- type: entity
