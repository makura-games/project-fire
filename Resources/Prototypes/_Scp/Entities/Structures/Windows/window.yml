# Окно
- type: entity
  id: BaseScpWindowDirectional
  parent: ScpBaseStructureDamageOnSpawnLow
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Scp/Structures/Windows/directional.rsi
  - type: Icon
    sprite: _Scp/Structures/Windows/directional.rsi
  - type: SpriteFade
  - type: DamageVisuals
    damageOverlay:
      sprite: _Scp/Effects/DamageOverlay/cracks_directional.rsi

- type: entity
  id: BaseScpWindowDirectionalCorner
  parent: BaseScpWindowDirectional
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Scp/Structures/Windows/directional_corner.rsi
  - type: Icon
    sprite: _Scp/Structures/Windows/directional_corner.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.28125"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "0.28125,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: InteractionOutline
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East

- type: entity
  id: BaseScpWindowDirectionalRound
