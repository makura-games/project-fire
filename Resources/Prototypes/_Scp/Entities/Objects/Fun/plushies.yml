- type: entity
  parent: BasePlushie
  id: PlushieScp999
  name: SCP-999 plushie
  description: A soft orange toy, resembling a slightly melted lump of jelly, exudes a warm, soothing glow. When touched, it emits a barely audible squeak of satisfaction, as if it is happy to be hugged.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Fun/Plushies/scp999.rsi
    state: icon
  - type: Item
    sprite: _Scp/Objects/Fun/Plushies/scp999.rsi
    size: Normal
  - type: MultiHandedItem
  - type: EmitSoundOnUse
    sound: &PlushieScp999Sound
      collection: HappyScp999
  - type: EmitSoundOnLand
    sound: *PlushieScp999Sound
  - type: EmitSoundOnActivate
    sound: *PlushieScp999Sound
  - type: EmitSoundOnTrigger
    sound: *PlushieScp999Sound
  - type: EmitSoundOnCollide
    sound: *PlushieScp999Sound
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit: *PlushieScp999Sound
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 10
        - ReagentId: JuiceThatMakesYouWeh
          Quantity: 10
  - type: Clothing
    quickEquip: false
    sprite: _Scp/Objects/Fun/Plushies/scp999.rsi
    slots:
    - HEAD
  - type: Tag
    tags:
    - Payload
    - ClothMade
    - PlushieScp999
    
- type: entity
  parent: PlushieHuman
  id: PlushieClassD
  name: class D plushie
  description: This plushie is dressed in a tiny orange jumpsuit. Despite its cute face, its button eyes reflect the realization that the next work can be its last.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Fun/Plushies/class_d.rsi
    state: icon
  - type: Clothing
    sprite: _Scp/Objects/Fun/Plushies/class_d.rsi
    slots:
    - HEAD

- type: entity
  id: PlushieWardex
  parent: BasePlushie
  name: Victoria Hill
  description: Your documents, please!
  components:
  - type: Sprite
    sprite: _Scp/Objects/Fun/Plushies/Fire_Staff.rsi
    state: wardex
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Misc/delta.ogg
  - type: UseDelay
    delay: 40

- type: entity
  id: PlushieZero
  parent: BasePlushie
  name: Vergil Nocturnus
  description: Vergil Nocturnus, known as “the Commissioner” or “Zero”. A long-standing employee of the foundation, known for his hot-tempered nature and love of Russian weapons. O5-8.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Fun/Plushies/Fire_Staff.rsi
    state: zero

- type: entity
  id: PlushiePuffiku
  parent: BasePlushie
  name: Emily Endsleigh
  description: A stern woman who loves and reveres bureaucracy. You can have a pleasant chat with her about anything, but God forbid she sees a violation... She reeks of ink and fresh paper.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Fun/Plushies/Fire_Staff.rsi
    state: puffiku

- type: entity
  id: PlushiePeper
  parent: BasePlushie
  name: Gavriil Grebenyuk
  description: The eternal “cadet”. Gavriil Grebenyuk is a Junior Officer in the Special Forces Unit, but don’t let such a low-ranking position fool you. Gavriil is one of the most experienced security service employees and...Perhaps.....He’s somehow involved in internal security.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Fun/Plushies/Fire_Staff.rsi
    state: peper