# Прототипы разных исследоватьских материалов, получаемых с СЦП

- type: entity
  id: BaseScpMaterial
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi

- type: entity
  id: BaseScpResearchMaterial
  parent:
  - BaseScpMaterial
  - BaseScpArtifactMajor
  abstract: true
  components:
  - type: GuideHelp
    guides:
    - ScpResearchAdvanced
  - type: Damageable
  - type: DamageOverlay
    damagePopupType: SmallFloating
    isStructure: true

# SCP-999

- type: entity
  id: Scp999Jelly
  parent: BaseScpResearchMaterial
  name: slimy jelly
  components:
  - type: Sprite
    state: scp999-jelly
  - type: Tag
    tags:
    - Scp999jelly

# SCP-173

- type: entity
  id: Scp173Shard
  parent: BaseScpResearchMaterial
  name: stone shard
  components:
  - type: Sprite
    state: scp173-shard
    color: "#a9783c"
  - type: Tag
    tags:
    - Scp173Shard

- type: entity
  id: Scp173PaintChips
  parent: BaseScpMaterial
  name: paint chips
  components:
  - type: Sprite
    state: scp173-chips
    color: "#e2b85f"

- type: entity
  id: Scp173PaintBall
  parent: BaseScpResearchMaterial
  name: paint ball
  components:
  - type: Sprite
    state: scp173-ball
    color: "#e2b85f"
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Effects/Footsteps/bounce.ogg
  - type: TileFrictionModifier
    modifier: 0.5
  - type: SwapEntityOnSpawn
    replace:
    - Ash
    chance: 0.4
  - type: Tag
    tags:
    - Scp173PaintBall

# Scp019

- type: entity
  id: Scp019GlassShard
  parent: BaseScpResearchMaterial
  name: ceramic shard
  description: Ceramic shard with recognizable ancient Greek style and decor.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi
    state: scp019-shard
  - type: Tag
    tags:
    - Scp019GlassShard

# Scp007, Scp124

- type: entity
  id: ScpDirtLump
  parent: BaseScpResearchMaterial
  name: lump of dirt
  description: A small pile of soil.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi
    state: scp-dirt
  - type: Tag
    tags:
    - ScpDirtLump

# Scp012

- type: entity
  id: Scp012Paper
  parent: BaseScpResearchMaterial
  name: old paper
  description: Yellowed piece of paper with bloody traces.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi
    state: scp012-paper
  - type: Tag
    tags:
    - Scp012Paper
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: Wood
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Appearance

# Scp106

- type: entity
  id: Scp106Cloth
  parent: BaseScpResearchMaterial
  name: rotten cloth
  description: Black and sticky piece of fabric that burns to the touch.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi
    state: scp106-cloth
  - type: Tag
    tags:
    - Scp106Cloth
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Scp106Reagent
        Quantity: 20

# Scp2295

- type: entity
  id: Scp2295Fiber1
  parent: BaseScpMaterial
  name: colorful fiber
  description: Colorful soft fibers with the smell of medicine and bleach, just like in hospitals.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi
    state: scp2295-fiber
  - type: Tag
    tags:
    - Scp2295Fiber
  - type: Healing
    delay: 0.5
    damageContainers:
      - Biological
    damage:
      types:
        Blunt: -6
        Slash: -6
        Piercing: -6
        Heat: -1
        Cold: -1
        Shock: -1
        Caustic: -1
    bloodlossModifier: -3
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: ColorfulFiber
    count: 1

# ScpUniversalCloth

- type: entity
  id: ScpUniversalCloth
  parent: BaseScpResearchMaterial
  name: beige cloth
  description: A strange-feeling beige piece of cloth.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/research_material.rsi
    state: universal-cloth
  - type: Tag
    tags:
    - ScpUniversalCloth

# Scp096

- type: entity # Для спавнов
  id: Scp096PhotoDeveloped
  parent: BaseScpMaterial
  name: strange photo
  description: A small photograph depicting a humanoid creature of anomalously large stature with disproportionately long arms. You peer into its face... oh god...
  components:
  - type: Sprite
    layers:
    - state: scp096-photo
  - type: Scp096Photo
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: Wood
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Appearance
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Sunrise/Items/Handling/paper_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Sunrise/Items/Handling/paper_drop.ogg
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Sunrise/Items/Handling/paper_use.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_Sunrise/Items/Handling/paper_drop.ogg
  - type: EmitSoundOnThrow
    sound:
      path: /Audio/_Sunrise/Items/Handling/paper_throw.ogg
  - type: Tag
    tags:
      - Trash
      - MetaGarbagePreventSaving
