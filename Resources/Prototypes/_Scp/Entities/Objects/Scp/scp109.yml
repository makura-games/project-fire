- type: entity
  id: Scp109
  parent:
  - BaseItemScp
  - DrinkFlaskOld
  name: army flask
  description: A standard 1899 United States Army water canteen.
  suffix: SCP-109
  components:
  - type: Sprite
    sprite: _Scp/Objects/Scp/scp-109.rsi
    state: icon
  - type: Scp
    class: Euclid # это в оригинале такое чудо
  - type: Item
    size: Small
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 2.5
      - ReagentId: Omnizine
        Quantity: 0.5
  - type: GuideHelp
    guides:
    - ScpResearch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/chopstickbreak.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          Scp109Broken:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        spawn:
          ScpUniversalCloth:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Scp109

- type: entity
  id: Scp109Broken
  categories: [ HideSpawnMenu ]
  parent:
  - BaseItemScp
  - DrinkFlaskOld
  name: army flask
  description: A standard 1899 United States Army water canteen.
  suffix: SCP-109
  components:
  - type: Sprite
    sprite: _Scp/Objects/Scp/scp-109.rsi
    state: broken
  - type: Scp
    class: Euclid
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 10
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: DirtyWater
        Quantity: 3
  - type: GuideHelp
    guides:
    - ScpResearch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/chopstickbreak.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          ScpUniversalCloth:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Scp109
