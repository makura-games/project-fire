- type: entity
  name: AR-18
  parent: BaseWeaponRifleSunrise
  id: WeaponRifleAR18
  categories: [ HideSpawnMenu ] # Fire edit
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Rifles/ar18/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Rifles/ar18/tiny.rsi
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2
    sprite: _Sunrise/Objects/Weapons/Guns/Rifles/ar18/tiny.rsi
  - type: Gun
    minAngle: 1.8
    maxAngle: 24
    angleIncrease: 1.25
    angleDecay: 8
    fireRate: 4.5
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Rifles/ar18/ar18_shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleHeavySP
        insertSound: /Audio/_Sunrise/Weapons/Guns/Snipers/Different/reload.ogg
        ejectSound: /Audio/_Sunrise/Weapons/Guns/Snipers/Different/unload.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineHeavyRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleHeavySP
        priority: 1
        whitelist:
          tags:
          - CartridgeHeavyRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
  - type: Tag # Fire Edit
    tags:
    - LockerGun5x3

- type: entity
  name: AK-103
  description: A classic Kalashnikov assault rifle in a modern design chambered for 7.62x39mm cartridges.
  parent: BaseWeaponRifle
  id: WeaponRifleAK103
  components:
  - type: Sprite
    sprite: _Scp/Objects/Weapons/ak_74/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Scp/Objects/Weapons/ak_74/tiny.rsi
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
    sprite: _Scp/Objects/Weapons/ak_74/tiny.rsi
  - type: Gun
    minAngle: 2.7
    maxAngle: 18
    angleIncrease: 2
    angleDecay: 12
    fireRate: 5.50
    soundGunshot:
      collection: ak47
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleSP
        insertSound: /Audio/_Sunrise/Weapons/Guns/Rifles/AK/ak_reload.ogg
        ejectSound: /Audio/_Sunrise/Weapons/Guns/Rifles/AK/ak_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleSP
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Sunrise/Weapons/Guns/Rifles/AK/ak_cocked.ogg
  - type: Tag
    tags:
    - LockerGun6x3

