- type: entity
  name: OTs-14 «Groza»
  description: The Russian assault small‑arms and grenade launcher complex, developed by TsKB SOO in 1993. It is designed for use in various combat conditions, including close combat and counter‑terrorism operations. Due to its specific design, it can accept magazines of 7.62 and 9×19 caliber.
  parent: BaseWeaponRifle
  id: WeaponRifleGroza
  components:
  - type: Sprite
    sprite: _Scp/Objects/Weapons/Groza/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
