# Другое

- type: entity
  parent: Pill
  id: PillSedative
  suffix: SCP
  components:
  - type: Sprite
    sprite: _Scp/Objects/Misc/sedative.rsi
    layers:
    - state: pill
  - type: Pill
    useStandardVisuals: false
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: SedativeReagent
        Quantity: 8
      - ReagentId: Epinephrine
        Quantity: 7
- type: entity
  parent: PillCanister
