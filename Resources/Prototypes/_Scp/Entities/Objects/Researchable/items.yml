# Пушки

# TODO: Чатгпт дал идею срать радиацией стреляющему при стрельбе. Мб стоит сделать
- type: entity
  name: Experimental X-Ray
  parent: BaseWeaponBattery
  id: WeaponGodlikeXRay
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/EGE_XR/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-5
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/EGE_XR/tiny.rsi
  - type: Item
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/EGE_XR/tiny.rsi
    size: Ginormous
  - type: GunWieldBonus
    minAngle: -93
    maxAngle: -94
  - type: Gun
    minAngle: 94
    maxAngle: 95
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Lasers/EG_XR.ogg
      params:
        pitch: 0.5
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: Battery
    maxCharge: 1000
    startingCharge: 0
  - type: BatteryAmmoProvider
    proto: UltraXrayLaser
    fireCost: 1000
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
#  - type: Telescope насрали

