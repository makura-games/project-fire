# Scp-035

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadAwareness
  components:
  - type: Sprite
    sprite: _Scp/Clothing/Head/Helmets/techno.rsi
    layers:
    - state: icon
      map: [ "mask" ]
  - type: Item
    size: Normal
    storedRotation: -90
  - type: ClothingAddComponents
    components:
    - type: Scp035MindProtection
    - type: Scp012Protection
    - type: Scp247Protection
