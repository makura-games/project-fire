# Scp-939

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesSilent
  suffix: SCP-939 Item
  components:
  - type: Sprite
    sprite: _Scp/Clothing/Shoes/Boots/silentboots.rsi
  - type: Item
    size: Normal
    storedRotation: -90
  - type: ClothingAddComponents
    components:
    - type: Scp939Protection
