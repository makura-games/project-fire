# Средства защиты от сцп

# Scp-173

- type: entity # TODO: Превратить в контейнер с химикатом
  parent: BaseItem
  id: EyeDroplets
  suffix: SCP-173 Item
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/patronbottle.rsi # TODO: Нормальный спрайт, а не алкашка
    state: icon_empty
    scale: 0.4,0.6
  - type: Item
    size: Tiny
  - type: ReducedBlinking
    firstBlinkingBonusTime: 30
    otherBlinkingBonusTime: 120
    otherBlinkingBonusDuration: 7
  - type: UseDelay
    delay: 3

# Scp-096

- type: entity
  id: BaseScp096Mask
  abstract: true
  components:
  - type: Clothing
    sprite: _Scp/Clothing/Head/Scp096/scp096_bag-equipped.rsi
    equipDelay: 3
    unequipDelay: 10
  - type: Item
    size: Normal
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: 90
    resetOnHandSelected: false
    animation: WeaponArcDisarm
    damage:
      types:
        Blunt: 0
  - type: ScpMask
    targetWhitelist:
      components:
      - Scp096
    damageOriginWhitelist:
      components:
      - MobState
    tearChanceOnDamage: 0.4
  - type: ClothingAddActions
    actions:
    - ScpTearMask

- type: entity
  parent:
  - ClothingHeadBase
  - BaseScp096Mask
  id: ClothingHeadBagScp096
  suffix: SCP-096 Item
  components:
  - type: Sprite
    sprite: _Scp/Clothing/Head/Scp096/scp096_bag-icons.rsi
    state: icon
  - type: Clothing
    unequipDelay: 1
  - type: ScpMask
    slots:
    - Head
    tearTime: 1 # мешок снимается легко
    tearChanceOnDamage: 0.8

- type: entity
  parent:
  - ClothingMaskBase
  - BaseScp096Mask
  id: ReinforcedMaskScp096
  suffix: SCP-096 Item
  components:
  - type: Sprite
    sprite: _Scp/Clothing/Mask/scp-096.rsi
    layers:
    - state: icon
      map: [ "mask" ]
  - type: Tag
    tags:
    - ReinforcedMaskScp096

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetAiPowered
  suffix: SCP-096 Item
  components:
  - type: PowerCellDraw
    drawRate: 3.5
    useCharge: 20
  - type: ItemToggle
    predictable: false # issues between ToggleCellDraw and ItemToggleActiveSound
    onUse: false
    canActivateInhand: false
    soundActivate:
      path: /Audio/_Sunrise/Items/Goggles/activate.ogg
    soundDeactivate:
      path: /Audio/_Sunrise/Items/Goggles/deactivate.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: ToggleCellDraw
  - type: ToggleClothing
    action: ProtectionToggleAction
    mustEquip: true
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
      - type: Scp096Protection
        problemChance: 0.003 # 0,3% каждый тик проебаться
  - type: Clothing
    equipDelay: 1.5
    unequipDelay: 1.5
  - type: Sprite
    sprite: _Scp/Clothing/Head/Helmets/aipowered.rsi
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - ClothingHeadHelmetAiPowered
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          tags:
          - PowerCellHigh
          - PowerCellHyper

# Scp-049

- type: entity
  id: Scp049ProtectionImplanter
  suffix: SCP-049 Protection
  parent: BaseImplantOnlyImplanter
  components:
  - type: Implanter
    implant: Scp049ProtectionImplant

- type: entity
  parent: BaseSubdermalImplant
  id: Scp049ProtectionImplant
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState
  - type: Scp049ProtectionImplant

