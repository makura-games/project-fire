- type: entity
  id: ScpRadio
  parent: BaseItem
  name: vintage radio
  description: Vintage old radio. It plays jazz!
  suffix: Decorative
  components:
  - type: Sprite
    sprite: _Scp/Objects/Misc/radio.rsi
    state: icon
  - type: ItemToggle
    soundActivate:
      path: /Audio/_Scp/Effects/Radio/static.ogg
      params:
        volume: -8
    soundDeactivate:
      path: /Audio/_Scp/Effects/Radio/toggle.ogg
      params:
        volume: -10
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Scp/Effects/vintage_song.ogg
      params:
        volume: -8
  - type: TriggerOnActivate
  - type: ItemToggleOnTrigger
  - type: UseDelay
    delay: 2
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          ScpMaterialWoodPlank1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Damageable
