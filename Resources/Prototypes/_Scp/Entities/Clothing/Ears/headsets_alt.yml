# Пустая гарнитура

- type: entity
  parent: Clothing
  id: ClothingHeadsetEmpty
  components:
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: Headset
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: Sprite
    sprite: Clothing/Ears/Headsets/base.rsi
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
    sprite: Clothing/Ears/Headsets/base.rsi
  - type: GuideHelp
    guides:
    - Radio

