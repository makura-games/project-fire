- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing, BaseChaosContraband]
  id: ClothingOuterArmorChaosHeavyVest
  name: heavy rebel vest
  description: Heavy armor of the Chaos Insurgents, has more protective elements and better armor plate.
  components:
  - type: Sprite
    sprite: _Scp/Clothing/OuterClothing/Armor/chaos_heavyvest.rsi
  - type: Clothing
    sprite: _Scp/Clothing/OuterClothing/Armor/chaos_heavyvest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.35
        Heat: 0.7
        Caustic: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: HeldSpeedModifier
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: GroupExamine

