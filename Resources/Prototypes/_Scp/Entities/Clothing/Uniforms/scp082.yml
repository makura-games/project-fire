- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformBaseScp082
  abstract: true
  components:
  - type: Sprite
    sprite: _Scp/Mobs/Scp/scp-082.rsi
    state: clothing
  - type: Clothing
    sprite: _Scp/Mobs/Scp/scp-082.rsi
  - type: Tag
    tags:
    - Scp082Clothing
  - type: ItemEquipWhitelist
    whitelist:
      components:
      - Scp082
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ItemSlots
    slots:
      storagebase:
        insertSound:
          collection: EquipSounds
          params:
            maxDistance: 3
        whitelist:
          sizes:
          - Tiny
          - Small
          - Normal
  - type: ContainerContainer
    containers:
      storagebase: !type:ContainerSlot

