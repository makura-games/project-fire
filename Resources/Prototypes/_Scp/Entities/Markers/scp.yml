# Основные сцп имеющие работку

- type: entity
  name: SCP-173 spawner
  id: SpawnScp173
  parent: SpawnPointJobBase
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _Scp/Mobs/Scp/scp-173.rsi
      state: scp-173
  - type: SpawnPoint
    spawn_type: Job
    job_id: Scp173
  - type: PreferredSpawn
    preferredSpawnTypes: [ Job ]
  - type: Scp173BlockStructureDamage

