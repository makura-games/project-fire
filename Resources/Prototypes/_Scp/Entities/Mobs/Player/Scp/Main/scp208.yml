- type: entity
  id: Scp208
  suffix: SCP-208
  name: ???
  parent:
  - BaseScpFriendlySapient
  - MobCombat
  - MobBloodstream
  - InventoryBase
  - StripableInventoryBase
  - AppearanceScpHumanoid
  components:
  - type: SlowOnDamage
    speedModifierThresholds:
      200: 0.9
      300: 0.8
      350: 0.7
  - type: TTS
    voice: Kopatich
  - type: Mood
#  - type: Blinkable
  - type: AutoGhostRole
    disconnectDelay: 600
    pollDuration: 900
    transferDelay: 180
  - type: Sprite
    drawdepth: Mobs
    sprite: _Scp/Mobs/Scp/scp-208.rsi
    layers:
    - state: scp-208
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      color: "#ffffff"
      visible: false
  - type: Scp
    class: Safe
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 5
  - type: GhostPanelAntagonistMarker
    name: ghost-panel-antagonist-scp-minor-name
    description: ghost-panel-antagonist-scp-minor-description
    priority: 0
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-scp208-name
    description: ghost-role-information-scp208-description
    raffle:
      settings: short
    job: Scp208
  - type: GhostTakeoverAvailable
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpResearchAdvanced
  - type: Loadout
    prototypes: [ Scp208Gear ]
  - type: ActionGrant
    actions:
    - Scp208Shield
  - type: Cuffable
  - type: Body
  - type: Paws
    screamInterval: 3
    thresholdDamage: 5
    coughInterval: 5
    emotesTakeDamage:
    - Pain
  - type: Fear
    phobias:
    - Exoremophobia
    - Necrophobia
  - type: ProximityTarget
  - type: ComponentToggler
    components:
    - type: FearSource
      phobiaType: Necrophobia
      uponComeCloser: None
    - type: WatchingTarget
  - type: Inventory
    templateId: scp208
  - type: Pacified
  - type: AoEHeal
    healSelf: false
    threshold: 0.9
    damage:
      types:
        Blunt: -1
        Slash: -1
        Piercing: -1
        Heat: -1.5
        Shock: -1.5
        Cold: -1.5
        Caustic: -2
        Radiation: -2
        Cellular: -2
        Asphyxiation: -0.5
    whitelist:
      components:
      - MobState
  - type: Scp208
    damage:
      types:
        Blunt: -3.5
        Slash: -3.5
        Piercing: -3.5
        Cellular: -4
        Cold: -2
        Shock: -3
        Radiation: -2
        Caustic: -2
        Heat: -3
        Asphyxiation: -1
    stopBleeding: true
    bloodlossModifier: -2.0
    delay: 3
    healingBeginSound:
      path: "/Audio/Effects/radpulse6.ogg"
      params:
        volume: -5
        variation: 0.125
    healingEndSound:
      path: "/Audio/Effects/radpulse4.ogg"
      params:
        volume: -5
        variation: 0.125
  - type: AmbientSound
    enabled: true
    volume: -5
    range: 3
    sound:
      path: /Audio/_Scp/Scp208/idle.ogg

- type: entity
  id: Scp208Wall
  name: green barrier
  parent: WallForce
  components:
  - type: Sprite
    sprite: _Scp/Mobs/Scp/scp-208.rsi
    state: wall
  - type: Icon
    sprite: _Scp/Mobs/Scp/scp-208.rsi
    state: wall
  - type: PointLight
    color: "#32CD32"
    radius: 2
    energy: 10
  - type: ScaleAnimation
    animationKey: scp208_wall
    duration: 0.5
    initialSize: 0.2, 0.2

- type: startingGear
  id: Scp208Gear
  equipment:
    neck: KeyCardScp208
