- type: entity
  parent: [ClothingMaskBase, BaseItemScp]
  id: ClothingMaskScp035
  suffix: SCP-035
  components:
  - type: TTS
    voice: dragon_knight_dragon_dota_2
  - type: Sprite
    sprite: _Scp/Objects/Scp/scp-035.rsi
    layers:
    - state: icon
      map: [ "mask" ]
  - type: Clothing
    sprite: _Scp/Objects/Scp/scp-035.rsi
  - type: SelfEquipOnly
  - type: FlashImmunity
  - type: EyeProtection
  - type: Scp
    class: Keter
  - type: Scp035Mask
    messages:
    - scp-035-message-one
    - scp-035-message-two
    - scp-035-message-three
    whitelistStructures:
      tags:
      - Window
      - Wall
  - type: ComponentToggler
    components:
    - type: FearSource
      uponSeenState: None
      uponComeCloser: Terror
    - type: ProximityReceiver
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpFear
  - type: ClothingAddActions
    actions:
    - ActionScp035Tentacles

- type: entity
  id: MobServant035
  parent: [ SimpleMobBase, MobCombat ]
  suffix: SCP-035 servant
  categories: [ HideSpawnMenu ] #Must be configured to a King or the AI breaks.
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Scp/Mobs/scp-035-servant.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: default
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 3.5
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: Scp035ServantCompound
    blackboard:
      IdleRange: !type:Single
        3.5
      FollowCloseRange: !type:Single
        2.0
      FollowRange: !type:Single
        3.0
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 30 #Bulky by mouse standards...
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: Stamina
    baseCritThreshold: 60
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
        Piercing: 3
  - type: Hunger # probably should be prototyped
    thresholds:
      Overfed: 200
      Okay: 150
      Peckish: 100
      Starving: 50
      Dead: 0
    baseDecayRate: 0.01666666666
  - type: Thirst
    thresholds:
      OverHydrated: 600
      Okay: 450
      Thirsty: 300
      Parched: 150
      Dead: 0
    baseDecayRate: 0.1
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rat
        BaseUnshaded: eyes
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeatRat
      amount: 1
  - type: Vocal
    sounds:
      Male: Mouse
      Female: Mouse
      Unsexed: Mouse
    wilhelmProbability: 0.001
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
  - type: NoSlip
  - type: MobPrice
    price: 500 # rat wealth
  - type: MobsterAccent
    isBoss: false
  - type: Speech
    speechVerb: SmallMob
  - type: GuideHelp
    guides:
    - MinorAntagonists
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning

- type: htnCompound
  id: Scp035ServantCompound
  branches:
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.MaskOrderType.Stay
    tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.MaskOrderType.Follow
    tasks:
    - !type:HTNCompoundTask
      task: FollowCompound
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.MaskOrderType.Kill
    tasks:
    - !type:HTNCompoundTask
      task: RatServantTargetAttackCompound
  - preconditions:
    - !type:HasOrdersPrecondition
      orders: enum.MaskOrderType.Loose
    tasks:
    - !type:HTNCompoundTask
      task: SimpleHostileCompound
