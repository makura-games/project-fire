- type: entity
  id: Scp939
  suffix: SCP-939
  parent:
  - BaseScp
  - MobCombat
  - MobAtmosStandard
  - MobBloodstream
  - InventoryBase
  components:
  - type: SoundWhileAlive
  - type: AutoGhostRole
    disconnectDelay: 600
    pollDuration: 900
    transferDelay: 180
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Scp/Mobs/Scp/scp-939.rsi
    layers:
    - map: [ "enum.Scp939Layers.Base" ]
      state: alive
  - type: Scp
    class: Keter
  - type: Scp939
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      collection: HitScp939
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 20
        Slash: 20
        Structural: 80
    range: 2
  - type: BloodSplatterer
    amount: 2, 6
    distance: 2, 25
    probability: 1
    bloodLineProbability: 0.4
    pierceLevel: HardenedMetal
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4
  - type: SlowOnDamage
    speedModifierThresholds:
      1000: 0.9
      1100: 0.8
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
  - type: Inventory
    templateId: scp939
  - type: ToggleableNightVision
    effect: ScpEffectNightVisionScp939
  - type: ScpAnnounceOnSpawn
    text: scp939-announce-on-spawn
    channels:
    - ScientificService
    - HeavyContainmentSecurityService
  - type: Puller
    needsHands: false
  - type: Pullable
  - type: Buckle
  - type: FlashImmunity
    enabled: false # переопределение родитесколько иммунитета
  - type: Muted
  - type: Strippable
  - type: Stripping
  - type: ScpPossibilities
    canEjectPilotFromMech: false
    openContainer: false
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: FootprintEmitter
    leftBareFootState:
    - footprint-left-bare-lizard
    rightBareFootState:
    - footprint-right-bare-lizard
  - type: TTS
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepScp939
  - type: EmitSoundRandomly
    sound:
      collection: IdleScp939
      params:
        maxDistance: 6
  - type: KillGlobalSound
    sound:
      collection: DistanceKillScp939
    originWhitelist:
      components:
      - Scp939
  - type: ScpExaminableDamage
    mode: MobToCritical
    generalMessages: ScpScp939Messages
    departmentMessages:
      HeavyContainmentSecurityService: ScpScp939SecurityMessages
      ExternalAdministrativeZoneSecurityService: ScpScp939SecurityMessages
    jobMessages:
      SecurityCommander: ScpScp939SecurityMessages
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpFear
  - type: HTN
    constantlyReplan: true
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        5
      AggroVisionRadius: !type:Single
        2
      FollowRange: !type:Single
        1
      MeleeRange: !type:Single
        3
  - type: NpcFactionMember
    factions:
      - SCPs
  - type: InputMover
  - type: MobMover
