- type: entity
  id: Scp247
  suffix: SCP-247
  parent:
  - BaseScpFriendly
  - SimpleMobBase
  - MobCombat
  components:
  - type: AutoGhostRole
    disconnectDelay: 600
    pollDuration: 900
    transferDelay: 180
  - type: Sprite
    sprite: _Scp/Mobs/Scp/scp-247.rsi
    drawdepth: Mobs
    layers:
    - state: scp-247
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Scp
    class: Euclid
  - type: Scp247
  - type: WatchingTarget
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: scp-247
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 45
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 25
        Structural: 35
    attackRate: 1.5
  - type: InteractionPopup
    successChance: 0.2
    interactSuccessString: scp247-pet-success
    interactFailureString: scp247-pet-failure
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_hiss.ogg
  - type: NoSlip
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
      - SCPs
  - type: InputMover
  - type: MobMover
  - type: GhostRole
    makeSentient: true
    name: scp247-ghost-role-name
    description: scp247-ghost-role-desc
    rules: scp247-ghost-role-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: ReplacementAccent
    accent: cat
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpFear
  - type: JumpAbility
    jumpDistance: 4
    jumpSound: /Audio/Animals/cat_hiss.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5.5
  - type: MeleeThrowOnHit # подтягивает к себе при ударе
    speed: 5
    distance: -1
    stunTime: 0.1
    activateOnThrown: true
  - type: UseDelay
    delay: 10
  - type: UseDelayOnMeleeHit
  - type: FelinidLicking
    damage:
      types:
        Blunt: -6
        Slash: -5
        Piercing: -5
    stopBleeding: true
    bloodlossModifier: -1.0
    delay: 5
    healingBeginSound:
      path: "/Audio/_Sunrise/Felinid/lick.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/_Sunrise/Felinid/lick.ogg"
      params:
        volume: 1.0
        variation: 0.125
