- type: entity
  id: Scp082
  name: SCP-082
  suffix: SCP-082
  parent:
  - BaseScp
  - BaseMob
  - MobDamageable
  - MobCombat
  - StripableInventoryBase
  - MobBloodstream
  - MobRespirator
  - MobAtmosStandard
  - MobFlammable
  - InventoryBase
  - AppearanceScpPredator
  components:
  - type: Clumsy # слишком большой чтобы взаимодействовать с чем то
    clumsyDefaultStunTime: 1
    gunShootFailStunTime: 1
    clumsyDefib: false
    clumsyHypo: false
    clumsySound:
      path: /Audio/Effects/chopstickbreak.ogg
  - type: RestrictedEquipment
    whitelist:
      tags:
      - Scp082Clothing
  - type: AutoGhostRole
    disconnectDelay: 600
    pollDuration: 900
    transferDelay: 180
  - type: Scp
    class: Euclid
  - type: Scp082
  - type: ScpHoldable
    minimumHolderCount: 3
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
  - type: Hands
    showInHands: false
  - type: Appearance
  - type: MobThresholds
    thresholds:
      0: Alive
      1800: Critical
      2000: Dead
#  - type: DamageStateVisuals временно, пока нет нужного компонента
#    states:
#      Alive:
#        Base: 082_fullbody
#        BaseUnshaded: tuxedo # временно, что бы не был голым
#      Critical:
#        Base: 082-dead
#        BaseUnshaded: tuxedo-dead # временно, что бы не был голым
#      Dead:
#        Base: 082-dead
#        BaseUnshaded: tuxedo-dead # временно, что бы не был голым
  - type: Inventory
    templateId: scp082
  - type: FieldOfView
    angle: 240
  - type: Hunger
  - type: Thirst
  - type: ScpPossibilities
    canEjectPilotFromMech: false
    openContainer: false
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Scp/Mobs/Scp/scp-082.rsi
    layers:
    - map: ["base"] 
      state: 082_fullbody
    - map: ["jumpsuit"]
  - type: ComplexInteraction
  - type: Buckle
  - type: ZombieImmune
  - type: SSDIndicator
  - type: Stripping
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 2.5
  - type: ScpRestriction
    canPull: true
    canStandingState: true
  - type: Pullable
  - type: Puller
    needsHands: true
  - type: SlowOnDamage
    speedModifierThresholds:
      1000: 0.9
      1300: 0.8
      1600: 0.7
  - type: Speech
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    animation: WeaponArcSmash
    wideAnimation: WeaponArcSmash
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 20
        Structural: 40
    attackRate: 1.25
    range: 2
  - type: MeleeThrowOnHit
    speed: 2
    distance: 0.25
  - type: TTS
    voice: Dota2Pudge
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpFear
  - type: HoldToFace
  - type: Prying
    enabled: false
    pryPowered: true
    force: true
    speedModifier: 0.9
    useSound:
      path: /Audio/_Scp/Scp096/prydoor.ogg
      params:
        volume: -4
  - type: Bloodstream
    bloodRefreshAmount: 5
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 1500
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vocal
    sounds:
      Male: SCP082
      Female: SCP082
      Unsexed: SCP082
  - type: Loadout
    prototypes: [ Scp082Gear ]
  - type: StandingState
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90

- type: startingGear
  id: Scp082Gear
  equipment:
    pocket2: Scp082Knife
