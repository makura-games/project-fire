- type: entity
  id: Scp457
  suffix: SCP-457
  parent:
  - BaseScp
  - SimpleSpaceMobBase
  components:
  - type: AmbientSound
    range: 6
    volume: -3
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AutoGhostRole
    disconnectDelay: 600
    pollDuration: 900
    transferDelay: 180
  - type: Sprite
    drawdepth: Mobs
    sprite: _Scp/Mobs/Scp/scp-457.rsi
    layers:
    - state: fireguy
      shader: unshaded
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: SafeTime
    timeFromRoundStart: false
  - type: Scp
    class: Euclid
  - type: Scp457
  - type: VentCrawler
  - type: ActionGrant
    actions:
    - Scp457Fire
  - type: FearSource
    uponSeenState: None
    uponComeCloser: Anxiety
    grainShaderStrength:
      min: 0
      max: 300
    vignetteShaderStrength:
      min: 0
      max: 100
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fireguy
      Critical:
        Base: fireguy_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
      - CannotSuicide
      - FootstepSound
      - DoorBumpOpener
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: GhostPanelAntagonistMarker
    name: ghost-panel-antagonist-scp-minor-name
    description: ghost-panel-antagonist-scp-minor-description
    priority: 0
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBlood
      params:
        volume: 6
  - type: Damageable
    damageModifierSet: SCP-457
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Critical
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
        - !type:HealthChange
          damage:
            types:
              Cold: 2
        - !type:AdjustReagent
          reagent: Fresium
          amount: 0.02
        - !type:PopupMessage
          type: Local
          messages: [ "scp-457-extinguished" ]
          probability: 0.25
        - !type:HitByWater
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Magic/fireball.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Heat: 14
  - type: Puller
    needsHands: false
  - type: Speech
    speechSounds: Lizard
  - type: TTS
    voice: dragon_knight_dragon_dota_2
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Cold: -3
        Poison: -200
        Slash: -200
        Piercing: -200
        Blunt: -200
        Heat: -200
  - type: Flammable
    canExtinguish: true
    alwaysCombustible: true
    firestacksOnIgnite: 10
    firestackFade: -0.5
    damage:
      types:
        Cold: 0
        Heat: 0
    flammableCollisionShape:
      !type:PhysShapeCircle
      radius: 2
  - type: Firestarter
  - type: PointLight
    radius: 2
    energy: 4.5
    color: "#ff8484"
    castShadows: false
  - type: ThermalRegulator
    radiatedHeat: 100000
    sweatHeatRegulation: 100000
    shiveringHeatRegulation: 0
    normalBodyTemperature: 1000
    implicitHeatRegulation: 200000
    metabolismHeat: 80000
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpFear

- type: entity
  id: Scp457Flame
  name: flame
  components:
  - type: Clickable
  - type: Fixtures
    fixtures:
      ignition:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: Sprite
    sprite: _Scp/Mobs/Scp/scp-457.rsi
    state: fire
  - type: TimedDespawn
    lifetime: 20
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Damageable
  - type: Physics
  - type: TriggerOnCollide
    fixtureID: ignition
  - type: FireStackOnTrigger
    fireStacks: 3
    targetUser: true
  - type: PointLight
    radius: 2
    energy: 4.5
    color: "#ff8484"
    castShadows: false
  - type: SpeedModifierContactCapClothing
