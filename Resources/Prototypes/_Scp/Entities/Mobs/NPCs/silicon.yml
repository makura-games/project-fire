- type: entity
  parent: MobCleanBot
  id: MobRoomba
  name: roomba
  description: The creep of automation now threatening janitors.
  components:
  - type: Tag
    tags:
    - SiliconEmotes
    - Bot
    - Unimplantable
    - Scp173DestroyOnCollide
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Scp/Mobs/Silicon/Bots/roomba.rsi
    state: roomba
  - type: FootprintAreaCleaner
    interval: 0.1
  - type: UseDelay
    delay: 0.1
  - type: HTN
    rootTask:
      task: CleanbotCompound
    blackboard:
      MeleeRange: !type:Single
        0.08
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 30
  - type: AmbientSound
    enabled: true
    volume: -7
    range: 5
    sound:
      path: /Audio/_Sunrise/Effects/Flying/medibot.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 80
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Construction
    graph: RoombaConstruct
    node: bot
